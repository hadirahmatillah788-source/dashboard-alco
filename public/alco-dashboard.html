<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCO Decision Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            600: '#1e3a8a',
                            700: '#1e3a8a',
                            800: '#1e40af',
                            900: '#172554',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SidebarItem = ({ icon, label, active }) => (
            <a href="#" className={`flex items-center gap-3 px-4 py-2.5 rounded-md text-sm transition-colors ${active ? 'bg-navy-900 text-white font-medium' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-900'}`}>
                <i className={`fa-solid ${icon} w-5 text-center`}></i>
                {label}
            </a>
        );

        const StatCard = ({ title, value }) => (
            <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm flex flex-col">
                <span className="text-gray-500 text-xs font-medium uppercase tracking-wider mb-1">{title}</span>
                <span className="text-2xl font-semibold text-gray-900">{value}</span>
            </div>
        );

        const Badge = ({ status }) => {
            const isAktif = status === 'Aktif';
            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-medium ${isAktif ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-gray-100 text-gray-600 border border-gray-200'}`}>
                    {status}
                </span>
            );
        };

        const SlideOver = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 overflow-hidden">
                    <div className="absolute inset-0 bg-gray-900 bg-opacity-25 transition-opacity" onClick={onClose}></div>
                    <div className="fixed inset-y-0 right-0 max-w-md w-full flex">
                        <div className="w-full h-full bg-white shadow-xl flex flex-col transform transition-transform duration-300 ease-in-out border-l border-gray-200">
                            {/* Header */}
                            <div className="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-white">
                                <h2 className="text-lg font-semibold text-gray-900">Detail Keputusan</h2>
                                <button onClick={onClose} className="text-gray-400 hover:text-gray-500 transition">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                            </div>

                            {/* Body */}
                            <div className="flex-1 overflow-y-auto px-6 py-5 bg-white">
                                <div className="mb-6">
                                    <span className="inline-block px-2 py-1 bg-navy-900 text-white text-[10px] font-semibold uppercase tracking-widest rounded mb-3">Suku Bunga</span>
                                    <h3 className="text-xl font-bold text-gray-900 leading-snug mb-2">Penetapan SBDK Sektor Korporasi Q4</h3>
                                    <div className="flex items-center gap-4 text-xs text-gray-500">
                                        <span className="flex items-center gap-1.5"><i className="fa-regular fa-calendar"></i> 25 Sep 2026</span>
                                        <span className="flex items-center gap-1.5"><i className="fa-solid fa-hashtag"></i> ALCO-20260925-01</span>
                                        <Badge status="Aktif" />
                                    </div>
                                </div>

                                <div className="prose prose-sm text-gray-600 space-y-4">
                                    <p className="leading-relaxed">
                                        Berdasarkan hasil rapat Asset Liability Committee (ALCO) tanggal 25 September 2026, mempertimbangkan kondisi likuiditas pasar dan tren penurunan suku bunga acuan bank sentral, maka diputuskan untuk melakukan penyesuaian Suku Bunga Dasar Kredit (SBDK) khususnya pada segmen korporasi guna meningkatkan daya saing penyaluran kredit pada kuartal keempat.
                                    </p>

                                    <div className="border border-gray-200 rounded-md overflow-hidden my-5">
                                        <table className="min-w-full divide-y divide-gray-200">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th className="px-4 py-2 text-left text-[11px] font-semibold text-gray-600 uppercase tracking-wider">Tenor</th>
                                                    <th className="px-4 py-2 text-right text-[11px] font-semibold text-gray-600 uppercase tracking-wider">SBDK Baru</th>
                                                    <th className="px-4 py-2 text-right text-[11px] font-semibold text-gray-600 uppercase tracking-wider">SBDK Lama</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200 text-sm">
                                                <tr>
                                                    <td className="px-4 py-2 text-gray-900 font-medium">1 Tahun</td>
                                                    <td className="px-4 py-2 text-right text-green-600 font-medium">7.25%</td>
                                                    <td className="px-4 py-2 text-right text-gray-500 line-through">7.50%</td>
                                                </tr>
                                                <tr>
                                                    <td className="px-4 py-2 text-gray-900 font-medium">3 Tahun</td>
                                                    <td className="px-4 py-2 text-right text-green-600 font-medium">7.75%</td>
                                                    <td className="px-4 py-2 text-right text-gray-500 line-through">8.10%</td>
                                                </tr>
                                                <tr>
                                                    <td className="px-4 py-2 text-gray-900 font-medium">5 Tahun</td>
                                                    <td className="px-4 py-2 text-right text-green-600 font-medium">8.25%</td>
                                                    <td className="px-4 py-2 text-right text-gray-500 line-through">8.50%</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                    <p className="leading-relaxed">
                                        Penyesuaian ini berlaku efektif mulai 1 Oktober 2026. Seluruh kantor cabang dan divisi bisnis korporasi diminta untuk segera menyesuaikan penawaran fasilitas kredit kepada nasabah eksisting maupun calon nasabah baru sesuai ketentuan yang berlaku.
                                    </p>
                                </div>
                            </div>

                            {/* Footer */}
                            <div className="px-6 py-5 border-t border-gray-200 bg-gray-50">
                                <a href="#" className="w-full flex justify-center items-center gap-2 bg-navy-900 hover:bg-navy-800 text-white font-medium py-2.5 px-4 rounded-md transition-colors text-sm shadow-sm">
                                    Buka File Asli di Google Drive <i className="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isDetailOpen, setIsDetailOpen] = useState(false);

            return (
                <div className="flex h-screen w-full">
                    {/* Sidebar */}
                    <aside className="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
                        <div className="h-16 flex items-center px-6 border-b border-gray-200">
                            <div className="flex items-center gap-2.5 text-navy-900">
                                <div className="bg-navy-900 p-1.5 rounded">
                                    <i className="fa-solid fa-scale-balanced text-white text-sm"></i>
                                </div>
                                <span className="font-bold text-lg tracking-tight">ALCO HUB</span>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1">
                            <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2 px-3 mt-2">Menu Utama</div>
                            <SidebarItem icon="fa-chart-pie" label="Dashboard" active={true} />
                            <SidebarItem icon="fa-layer-group" label="Semua Keputusan" active={false} />
                            <SidebarItem icon="fa-circle-check" label="Keputusan Aktif" active={false} />
                            <SidebarItem icon="fa-clock-rotate-left" label="Keputusan Tidak Berlaku" active={false} />

                            <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2 px-3 mt-6">Pengaturan</div>
                            <SidebarItem icon="fa-tags" label="Kategori" active={false} />
                            <SidebarItem icon="fa-users" label="Manajemen User" active={false} />
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                        {/* Top Header */}
                        <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 flex-shrink-0">
                            <div className="relative w-96">
                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                                <input
                                    type="text"
                                    placeholder="Search decisions, topics, etc."
                                    className="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-navy-900 focus:border-transparent transition-all"
                                />
                            </div>
                            <div className="flex items-center gap-5">
                                <button className="text-gray-400 hover:text-navy-900 transition-colors relative">
                                    <i className="fa-regular fa-bell text-lg"></i>
                                    <span className="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                                </button>
                                <div className="h-8 w-px bg-gray-200"></div>
                                <div className="flex items-center gap-3 cursor-pointer">
                                    <div className="w-8 h-8 rounded-full bg-navy-900 text-white flex items-center justify-center text-sm font-semibold">
                                        AD
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-sm font-medium text-gray-900 leading-none">Admin ALCO</span>
                                        <span className="text-[11px] text-gray-500">Administrator</span>
                                    </div>
                                    <i className="fa-solid fa-chevron-down text-xs text-gray-400 ml-1"></i>
                                </div>
                            </div>
                        </header>

                        {/* Page Content */}
                        <main className="flex-1 overflow-y-auto p-8">
                            <div className="max-w-6xl mx-auto">
                                {/* Page Header */}
                                <div className="flex items-center justify-between mb-8">
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900 tracking-tight">Ringkasan Keputusan ALCO</h1>
                                        <p className="text-sm text-gray-500 mt-1">Overview data keputusan Asset Liability Committee</p>
                                    </div>
                                    <button className="bg-navy-900 hover:bg-navy-800 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                                        <i className="fa-solid fa-plus text-xs"></i> Tambah Keputusan Baru
                                    </button>
                                </div>

                                {/* Stats Cards */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
                                    <StatCard title="Total Keputusan" value="227" />
                                    <StatCard title="Keputusan Aktif" value="142" />
                                    <StatCard title="Diperbarui Bulan Ini" value="15" />
                                    <StatCard title="Arsip" value="85" />
                                </div>

                                {/* Data Table */}
                                <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                                    <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-white">
                                        <h2 className="text-base font-semibold text-gray-900">Keputusan Terbaru</h2>
                                        <button className="text-sm text-navy-900 font-medium hover:underline">Lihat Semua</button>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full divide-y divide-gray-200">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th scope="col" className="px-6 py-3 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">No. Keputusan</th>
                                                    <th scope="col" className="px-6 py-3 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Judul / Topik</th>
                                                    <th scope="col" className="px-6 py-3 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Tanggal Rapat</th>
                                                    <th scope="col" className="px-6 py-3 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                                                    <th scope="col" className="px-6 py-3 text-center text-[11px] font-semibold text-gray-500 uppercase tracking-wider">File Asli</th>
                                                    <th scope="col" className="px-6 py-3 text-right text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200">
                                                {/* Row 1 */}
                                                <tr className="hover:bg-gray-50 transition-colors">
                                                    <td className="px-6 py-4 whitespace-nowrap text-xs font-medium text-gray-900">
                                                        ALCO-20260925-01
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                                        Penetapan SBDK Sektor Korporasi Q4
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                        25 Sep 2026
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <Badge status="Aktif" />
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-center">
                                                        <a href="#" className="text-gray-400 hover:text-navy-900 transition-colors" title="Google Drive Link">
                                                            <i className="fa-brands fa-google-drive text-lg"></i>
                                                        </a>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                        <div className="flex justify-end gap-2">
                                                            <button
                                                                onClick={() => setIsDetailOpen(true)}
                                                                className="px-3 py-1.5 border border-gray-200 rounded text-gray-600 hover:bg-gray-50 hover:text-navy-900 transition-colors text-xs font-medium"
                                                            >
                                                                Lihat Detail
                                                            </button>
                                                            <button className="px-3 py-1.5 border border-gray-200 rounded text-gray-600 hover:bg-gray-50 hover:text-navy-900 transition-colors text-xs font-medium">
                                                                Edit
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>

                                                {/* Row 2 */}
                                                <tr className="hover:bg-gray-50 transition-colors">
                                                    <td className="px-6 py-4 whitespace-nowrap text-xs font-medium text-gray-900">
                                                        ALCO-20260810-03
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                                        Revisi Target LDR Q3
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                        10 Aug 2026
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <Badge status="Tidak Berlaku" />
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-center">
                                                        <a href="#" className="text-gray-400 hover:text-navy-900 transition-colors" title="Google Drive Link">
                                                            <i className="fa-brands fa-google-drive text-lg"></i>
                                                        </a>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                        <div className="flex justify-end gap-2">
                                                            <button className="px-3 py-1.5 border border-gray-200 rounded text-gray-600 hover:bg-gray-50 hover:text-navy-900 transition-colors text-xs font-medium">
                                                                Lihat Detail
                                                            </button>
                                                            <button className="px-3 py-1.5 border border-gray-200 rounded text-gray-600 hover:bg-gray-50 hover:text-navy-900 transition-colors text-xs font-medium">
                                                                Edit
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    <SlideOver isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
