<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Treasury - Bank Kalsel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: #059669;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        .btn {
            background: white;
            color: #059669;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .card {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background: #ecfdf5;
            color: #059669;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon-circle svg {
            width: 36px;
            height: 36px;
        }
        .btn-direct {
            display: inline-block;
            background: #059669;
            color: white;
            text-decoration: none;
            padding: 0.85rem 1.75rem;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        .btn-direct:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Laporan TREASURY - BANK KALSEL</h1>
        <a href="portal.html" class="btn">Kembali ke Portal</a>
    </div>

    <div class="container">
        <div class="card">
            <div class="icon-circle">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </div>
            <h2 style="margin: 0 0 0.75rem; color: #111827;">Laporan Treasury Bank Kalsel</h2>
            <p style="color: #6b7280; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1rem;">
                Sedang mengalihkan Anda ke sistem Laporan Treasury...
            </p>
            <a href="https://treasury-likuiditas.ai.studio/" class="btn-direct">
                Buka Laporan Treasury &rarr;
            </a>
            <div style="margin-top: 1.5rem;">
                <a href="portal.html" style="font-size: 0.85rem; color: #9ca3af; text-decoration: none;">&larr; Kembali ke Portal</a>
            </div>
        </div>
    </div>

    <script>
        // Otomatis langsung berpindah ke link Treasury Likuiditas tanpa login
        window.location.replace("https://treasury-likuiditas.ai.studio/");
    </script>
</body>
</html>
